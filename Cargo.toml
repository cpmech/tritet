[package]
name = "tritet"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "Triangle and tetrahedron mesh generators"
homepage = "https://github.com/cpmech/tritet"
repository = "https://github.com/cpmech/tritet"
documentation = "https://docs.rs/tritet"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["2D", "3D", "mesh", "geometry"]

[dependencies]
plotpy = "1.13"
once_cell = "1.21"

[build-dependencies]
cc = "1.2"
cfg-if = "1.0.1"

[features]
default = ["trigen"]
trigen = []

[[bin]]
name = "mem_check_triangle_build"
required-features = ["trigen"]

[[example]]
name = "triangle_delaunay_1"
required-features = ["trigen"]

[[example]]
name = "triangle_mesh_1"
required-features = ["trigen"]

[[example]]
name = "triangle_print_coords"
required-features = ["trigen"]

[[example]]
name = "triangle_voronoi_1"
required-features = ["trigen"]

[[test]]
name = "test_triangle_mesh_1"
required-features = ["trigen"]