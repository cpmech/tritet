name: Ubuntu
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install Libraries
        run: |
          sudo apt-get update -y && sudo apt-get install -y build-essential
      - name: Run tests
        run: |
          cargo test --features with_tetgen -- --nocapture
